name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Validate PlexEx
    uses: ./.github/workflows/validate.yaml
    permissions:
      contents: read

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validation

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validation.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes