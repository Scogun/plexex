search:
  name: Search
  description: Search the Plex library for movies, shows, seasons, or episodes by a title or title fragment.
  fields:
    type:
      name: Type
      description: Kind of library item to search for.
      required: true
      selector:
        select:
          options:
            - movie
            - show
            - season
            - episode
    title:
      name: Title
      description: Full or partial title of the item itself. For a season or an episode this is its own title, not the title of the show.
      required: true
      selector:
        text:
    server:
      name: Server
      description: Select a PlexEx connection. Leave empty when only one is configured.
      required: false
      selector:
        config_entry:
          integration: plexex

search_movies:
  name: Search movies (deprecated)
  description: Deprecated, will be removed in PlexEx 0.10.0. Use the Search action with the type set to movie instead.
  fields:
    title:
      name: Title
      description: Full or partial movie title.
      required: true
      selector:
        text:
    server:
      name: Server
      description: Select a PlexEx connection. Leave empty when only one is configured.
      required: false
      selector:
        config_entry:
          integration: plexex

mark_unwatched:
  name: Mark unwatched
  description: Mark a Plex library item as unwatched using its rating key.
  fields:
    rating_key:
      name: Rating key
      description: The ratingKey returned by plexex.search_movies.
      required: true
      selector:
        number:
          min: 1
          mode: box
          step: 1
    server:
      name: Server
      description: Select a PlexEx connection. Leave empty when only one is configured.
      required: false
      selector:
        config_entry:
          integration: plexex

skip_marker:
  name: Skip marker
  description: Seek a Plex player to the end of the intro, credits, or commercial break it is playing right now.
  fields:
    entity_id:
      name: Player
      description: Media player of the official Plex integration.
      required: true
      selector:
        entity:
          integration: plex
          domain: media_player
    markers:
      name: Markers
      description: Kinds of markers to skip. Leave empty to skip any marker.
      required: false
      selector:
        select:
          multiple: true
          options:
            - intro
            - credits
            - final_credits
            - commercial
